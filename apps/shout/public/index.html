<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SHOUT</title>
  <meta name="theme-color" content="#0038a8">
  <link rel="icon" type="image/png" href="/shout-wordmark.png">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
  </svg>
  <div id="app" class="app">
    <aside class="sidebar" aria-label="Sessions">
      <div class="sidebar-top">
        <a class="brand wordmark" href="/" aria-label="SHOUT home"><img src="/shout-wordmark.png" alt="SHOUT!" width="1983" height="793"></a>
        <button class="icon-button sidebar-close" id="sidebar-close" aria-label="Close sessions"><svg><use href="#i-x"/></svg></button>
      </div>
      <button class="new-session" id="new-session"><svg><use href="#i-plus"/></svg>New session<kbd>N</kbd></button>
      <div class="sidebar-label">Sessions <span id="session-count">0</span></div>
      <nav id="session-list" class="session-list" aria-label="Session list"></nav>
      <div class="sidebar-bottom">
        <div class="provider"><span class="engine-dot" id="engine-dot"></span><span id="provider-status">Connecting…</span></div>
        <div class="theme-switch" role="radiogroup" aria-label="Theme">
          <button type="button" role="radio" data-theme-choice="system" aria-label="System theme" title="System"><svg><use href="#i-monitor"/></svg></button>
          <button type="button" role="radio" data-theme-choice="light" aria-label="Light theme" title="Light"><svg><use href="#i-sun"/></svg></button>
          <button type="button" role="radio" data-theme-choice="dark" aria-label="Dark theme" title="Dark"><svg><use href="#i-moon"/></svg></button>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="workspace">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menu-button" aria-label="Toggle sessions"><svg><use href="#i-menu"/></svg></button>
        <a class="mobile-brand wordmark" href="/" aria-label="SHOUT home"><img src="/shout-wordmark.png" alt="SHOUT!" width="1983" height="793"></a>
        <div class="session-heading">
          <h1 id="session-title">Workspace</h1>
          <div class="session-meta-line"><span id="mode-badge" class="badge" hidden></span><span id="workspace-path" class="workspace-path"></span></div>
        </div>
        <div class="topbar-actions">
          <button class="toolbar-button" id="files-button" aria-pressed="false" title="Browse workspace files"><svg><use href="#i-folder"/></svg><span>Files</span></button>
          <button class="toolbar-button" id="export-button" disabled title="Download session as JSON"><svg><use href="#i-download"/></svg><span>Export</span></button>
          <button class="toolbar-button" id="viz-button" aria-pressed="true" title="Toggle inspector"><svg><use href="#i-panel"/></svg><span>Inspector</span></button>
        </div>
      </header>
      <div class="workspace-body">
        <section class="conversation" aria-label="Conversation">
          <div id="messages" class="messages" aria-live="polite" aria-relevant="additions"></div>
          <div class="composer-area">
            <div id="question-area"></div>
            <div id="storage-warning" class="storage-warning" role="alert" hidden></div>
            <div id="status-line" class="status-line" aria-live="polite"><span class="status-dot"></span><span id="status-text">Ready</span><button id="cancel-button" class="text-button danger" hidden>Cancel run</button></div>
            <form id="composer" class="composer">
              <label class="sr-only" for="message-input">Message SHOUT</label>
              <textarea id="message-input" placeholder="Message SHOUT" rows="2"></textarea>
              <div class="composer-bottom">
                <span class="input-hint"><code>/test</code> runs tests<span class="nl"> · <kbd>Shift</kbd>+<kbd>Enter</kbd> for newline</span></span>
                <button type="submit" id="send-button" class="send-button" aria-label="Send message"><svg><use href="#i-send"/></svg></button>
              </div>
            </form>
          </div>
        </section>
        <aside id="inspector" class="inspector" aria-label="Inspector">
          <div class="inspector-header">
            <h2 id="inspector-title">Inspector</h2>
            <span class="live-indicator" id="connection-status">Live</span>
          </div>
          <div class="inspector-tabs" role="tablist">
            <button id="graph-tab" class="active" role="tab" aria-selected="true">Flow</button>
            <button id="trace-tab" role="tab" aria-selected="false">Events <span class="count" id="event-count">0</span></button>
            <button id="changes-tab" role="tab" aria-selected="false">Changes <span class="count" id="change-count">0</span></button>
          </div>
          <div id="viz-toolbar" class="viz-toolbar">
            <label class="sr-only" for="run-filter">Filter by run</label><select id="run-filter"><option value="">All runs</option></select>
            <label class="sr-only" for="event-filter">Filter events</label><input id="event-filter" type="search" placeholder="Filter events">
          </div>
          <div id="inspector-content" class="inspector-content"></div>
          <div id="event-detail" class="event-detail" hidden></div>
          <div class="inspector-footer"><span><i class="legend-dot user"></i>You</span><span><i class="legend-dot harness"></i>SHOUT</span><span><i class="legend-dot model"></i>Model</span><span><i class="legend-dot vm"></i>ALLEN</span><span><i class="legend-dot tool"></i>Tools</span></div>
        </aside>
      </div>
    </main>
  </div>
  <dialog id="new-dialog" aria-labelledby="new-dialog-title">
    <form id="new-form">
      <div class="dialog-heading"><h2 id="new-dialog-title">New session</h2><button type="button" class="icon-button" id="close-dialog" aria-label="Close"><svg><use href="#i-x"/></svg></button></div>
      <div class="field-label">Sample workspace <span class="optional">optional</span></div>
      <div id="dialog-scenarios" class="dialog-scenarios"></div>
      <label for="workspace-input">Workspace path</label><input id="workspace-input" name="workspace" placeholder="/path/to/your/project" autocomplete="off" spellcheck="false">
      <div class="field-row">
        <div><label for="mode-input">Model provider</label><select id="mode-input" name="mode"><option value="live">Live (Codex)</option><option value="fixture">Fixture (no model calls)</option></select></div>
        <div><label for="test-command-input">Test command <span class="optional">optional</span></label><input id="test-command-input" name="testCommand" placeholder="npm test" autocomplete="off" spellcheck="false"></div>
      </div>
      <p class="field-help" id="model-help" hidden></p>
      <p id="new-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-footer"><button type="button" id="cancel-dialog" class="secondary-button">Cancel</button><button type="submit" class="primary-button" id="create-button">Create session</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
